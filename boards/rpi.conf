# Board profile: Raspberry Pi (aarch64)
# Firmware boots kernel*.img directly via config.txt/cmdline.txt; nothing
# needs to live ahead of the first partition.

KERNEL_FLAVOR=rpi
BOOT_STRATEGY=firmware
BOOT_START=2048                 # 1MiB (512b sectors)
UBOOT_URL=
UBOOT_OFFSET_SECTORS=
CONSOLE="serial0,115200 ttyAMA0,115200"
