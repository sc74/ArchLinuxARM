# Board profile: Odroid N2+ (Amlogic S922X)
# Boots via mainline U-Boot loaded through Amlogic's BL2/FIP scheme. Unlike a
# single wholesale blob write, this needs two writes that deliberately avoid
# the MBR partition table bytes (446-510):
#   1. the bulk payload, one sector in
#   2. the leading boot code, stopping just short of the partition table
# See https://docs.u-boot.org/en/latest/board/amlogic/odroid-n2.html and
# https://archlinuxarm.org/platforms/armv8/amlogic/odroid-n2

KERNEL_FLAVOR=generic
BOOT_STRATEGY=extlinux
# ALARM's own N2 install guide starts partition 1 at sector 4096 (2MiB),
# leaving enough room for the mainline U-Boot image ahead of it.
BOOT_START=4096                 # 2MiB (512b sectors)
UBOOT_URL=http://os.archlinuxarm.org/os/amlogic/boot/odroid-n2/u-boot.bin.sd.bin
UBOOT_OFFSET_SECTORS=            # unused: install_bootloader() below is overridden
CONSOLE="ttyAML0,115200n8"

install_bootloader() {
  local uboot_bin="$1" img="$2"
  dd if="$uboot_bin" of="$img" bs=512 skip=1 seek=1 conv=notrunc,fsync
  dd if="$uboot_bin" of="$img" bs=1   count=440       conv=notrunc,fsync
}
