# Board profile: Orange Pi 5B (rk3588s)
# Boots via a pre-built, signed U-Boot + ATF + DDR blob written raw ahead of
# the partition table; U-Boot then loads the kernel via extlinux.conf.
# See https://github.com/schneid-l/u-boot-rockchip

KERNEL_FLAVOR=generic
BOOT_STRATEGY=extlinux
# idbloader+u-boot.itb (~9.3MiB) is written at sector 64 (32KiB), so
# partition 1 must start well past it - 16MiB is the conventional
# Rockchip/Armbian offset.
BOOT_START=32768                # 16MiB (512b sectors)
UBOOT_URL=https://github.com/schneid-l/u-boot-rockchip/releases/latest/download/u-boot-orangepi-5-rk3588s.bin
UBOOT_OFFSET_SECTORS=64
CONSOLE="ttyS2,1500000"
